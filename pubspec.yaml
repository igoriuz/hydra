name: hydra
description: Responsive and adaptive Flutter layouts with breakpoints. Swap widgets, values, grids and visibility per screen size, animated, with zero dependencies.
version: 2.1.0
homepage: https://github.com/igoriuz/hydra
issue_tracker: https://github.com/igoriuz/hydra/issues
repository: https://github.com/igoriuz/hydra
topics:
  - responsive
  - adaptive
  - breakpoint
  - layout
  - widget

screenshots:
  - description: A layout built with Hydra at the large breakpoint, with side navigation and a four-column grid.
    path: screenshots/large.png
  - description: The same widget tree at the mini breakpoint, with a bottom bar and a single-column list.
    path: screenshots/mini.png

environment:
  sdk: '>=3.5.0 <4.0.0'
  flutter: '>=3.24.0'

dependencies:
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter
  very_good_analysis: ^11.0.0
